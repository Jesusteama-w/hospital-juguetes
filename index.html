<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>El hospital de los juguetes olvidados</title>
  <meta name="description" content="Un cuento animado para chicos de 6 a 12 años sobre las pantallas, el juego y las chispitas de alegría sana.">
  <meta name="theme-color" content="#161b27">
  <meta property="og:title" content="El hospital de los juguetes olvidados">
  <meta property="og:description" content="Un cuento para jugar de verdad.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css?v=31">
</head>
<body class="animo-noche">

  <!-- Degradés y filtros compartidos por las ilustraciones (paleta apagada) -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gNoche" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2538"/><stop offset="1" stop-color="#3e5068"/></linearGradient>
      <linearGradient id="gDia" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9c6d3"/><stop offset="1" stop-color="#eee6d6"/></linearGradient>
      <linearGradient id="gAtardecer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a17f"/><stop offset="1" stop-color="#f1e0c6"/></linearGradient>
      <linearGradient id="gAmanecer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2ae86"/><stop offset=".6" stop-color="#efd9b8"/><stop offset="1" stop-color="#f4ead8"/></linearGradient>
      <linearGradient id="gCuarto" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d6d6"/><stop offset="1" stop-color="#ebe6dc"/></linearGradient>
      <linearGradient id="gOscuro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a28"/><stop offset="1" stop-color="#2a3650"/></linearGradient>
      <linearGradient id="gPantalla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3f0ff"/><stop offset="1" stop-color="#5fb8e6"/></linearGradient>
      <radialGradient id="gLuzFria"><stop offset="0" stop-color="#7fd6ff" stop-opacity=".7"/><stop offset="1" stop-color="#7fd6ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="gLuzCalida"><stop offset="0" stop-color="#f0c27a" stop-opacity=".85"/><stop offset="1" stop-color="#e0a070" stop-opacity="0"/></radialGradient>
      <filter id="fGris"><feColorMatrix type="saturate" values=".1"/></filter>
    </defs>
  </svg>

  <!-- MUNDO (atrás del libro): juguetes flotando, luz y polvo -->
  <div class="mundo" id="mundo" aria-hidden="true">
    <div class="mundo-tinte"></div>
    <canvas id="ambiente"></canvas>
    <div class="capa capa-lejos" id="capaLejos"></div>
    <div class="capa capa-medio" id="capaMedio"></div>
    <div class="capa capa-asomos" id="asomos"></div>
  </div>

  <div id="precarga" aria-hidden="true">
    <div class="pre-osito">🧸</div>
    <p>Abriendo el cuento…</p>
  </div>

  <header class="barra">
    <div class="marca"><span class="marca-txt">El hospital de los juguetes olvidados</span></div>
    <div class="controles">
      <button class="ctrl" id="btnVoz" aria-pressed="false" title="Leer en voz alta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="lleno" d="M4 9v6h4l5 4V5L8 9H4z"/><path class="onda" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
        <span>Leer</span>
      </button>
      <button class="ctrl" id="btnSonido" aria-pressed="true" title="Música y sonidos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle class="lleno" cx="6.5" cy="18" r="2.5"/><circle class="lleno" cx="16.5" cy="16" r="2.5"/></svg>
        <span>Sonido</span>
      </button>
      <button class="ctrl ctrl-solo" id="btnPantalla" title="Pantalla completa" aria-label="Pantalla completa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main class="escenario" id="escenario">
    <div class="flota">
      <div class="inclina" id="inclina">
        <div class="libro cerrado" id="libro" aria-live="polite"></div>
      </div>
    </div>
  </main>

  <!-- FRENTE (arriba del libro): cosas que salen del libro, personajes en el borde, flechas-guía -->
  <div class="frente-mundo" id="frenteMundo" aria-hidden="true"></div>
  <div class="bordes" id="bordes"></div>
  <svg class="guia" id="guia" aria-hidden="true"></svg>

  <nav class="ruta" aria-label="Pasar páginas">
    <button class="nav-btn" id="ant" aria-label="Página anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="riel">
      <div class="via"></div>
      <div class="estaciones" id="estaciones"></div>
      <div class="trencito" id="trencito" aria-hidden="true">
        <svg viewBox="0 0 60 40">
          <rect x="4" y="16" width="30" height="14" rx="3" fill="#c8704a" stroke="#2e2a33" stroke-width="2"/>
          <rect x="30" y="6" width="18" height="24" rx="3" fill="#d9a441" stroke="#2e2a33" stroke-width="2"/>
          <rect x="34" y="10" width="10" height="8" rx="2" fill="#c9dde6"/>
          <rect x="9" y="8" width="7" height="9" fill="#2e2a33"/>
          <circle class="humo" cx="12" cy="4" r="3.5" fill="#efe3cc"/>
          <g class="rueda"><circle cx="12" cy="32" r="5" fill="#2e2a33"/><path d="M12 28v8M8 32h8" stroke="#d9a441" stroke-width="1.5"/></g>
          <g class="rueda"><circle cx="26" cy="32" r="5" fill="#2e2a33"/><path d="M26 28v8M22 32h8" stroke="#d9a441" stroke-width="1.5"/></g>
          <g class="rueda"><circle cx="41" cy="32" r="6" fill="#2e2a33"/><path d="M41 27v10M36 32h10" stroke="#d9a441" stroke-width="1.5"/></g>
        </svg>
      </div>
      <div class="contador" id="contador">Tapa</div>
    </div>
    <button class="nav-btn nav-sig" id="sig" aria-label="Página siguiente">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>

  <div class="confeti-capa" id="confeti" aria-hidden="true"></div>
  <div class="grano" aria-hidden="true"></div>

  <div class="modal" id="grandes" role="dialog" aria-modal="true" aria-labelledby="grandesTitulo" hidden>
    <div class="modal-caja">
      <button class="modal-cerrar" data-accion="cerrar" aria-label="Cerrar">✕</button>
      <h2 id="grandesTitulo">Para mamás, papás y docentes</h2>
      <p>Este cuento es una invitación a conversar, no un reto. Algunas ideas para después de leerlo:</p>
      <ul id="consejos"></ul>
      <button class="btn-suave" data-accion="cerrar">Entendido</button>
    </div>
  </div>

  <!-- DISEÑO: texto + ilustraciones · FUNCIONALIDAD: mundo + libro -->
  <script src="js/cuento.js?v=31"></script>
  <script src="js/ilustraciones.js?v=31"></script>
  <script src="js/mundo.js?v=31"></script>
  <script src="js/app.js?v=32"></script>
</body>
</html>
